<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DM Dental Clinic - Patient Logs</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800 antialiased">

  <div id="auth-container" class="max-w-md mx-4 sm:mx-auto mt-6 sm:mt-12 p-4 sm:p-6 bg-white rounded-xl shadow-md border border-slate-200">
    <div class="flex items-center justify-center gap-3 mb-2">
      <img src="logo.png" alt="Logo" class="h-8 sm:h-9 w-auto" />
      <h1 class="text-xl sm:text-2xl font-bold text-slate-900">DM Dental Clinic</h1>
    </div>
    <p class="text-xs sm:text-sm text-slate-500 text-center mb-6">Patient Management System</p>

    <div class="flex border-b border-slate-200 mb-4 text-xs sm:text-sm">
      <button id="tab-login" onclick="switchAuthTab('login')" class="flex-1 py-2.5 font-medium text-black border-b-2 border-black transition">Login</button>
      <button id="tab-signup" onclick="switchAuthTab('signup')" class="flex-1 py-2.5 font-medium text-slate-400 hover:text-slate-600 transition">Register</button>
      <button id="tab-link" onclick="switchAuthTab('link')" class="flex-1 py-2.5 font-medium text-slate-400 hover:text-slate-600 transition">Passwordless</button>
    </div>

    <form id="form-auth" onsubmit="handleEmailAuth(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Email</label>
        <input type="email" id="auth-email" required class="w-full p-2.5 text-sm border border-slate-300 rounded focus:ring-2 focus:ring-slate-900 focus:outline-none" />
      </div>
      <div id="password-wrapper">
        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Password</label>
        <input type="password" id="auth-password" class="w-full p-2.5 text-sm border border-slate-300 rounded focus:ring-2 focus:ring-slate-900 focus:outline-none" />
      </div>
      <button type="submit" id="auth-submit-btn" class="w-full bg-slate-900 hover:bg-black text-white font-semibold py-2.5 rounded transition text-sm">
        Login
      </button>
    </form>

    <div class="relative my-6 text-center">
      <hr class="border-slate-200" />
      <span class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-white px-2 text-xs text-slate-400">OR</span>
    </div>

    <button onclick="handleGoogleSignIn()" class="w-full flex items-center justify-center gap-2 border border-slate-300 py-2.5 rounded hover:bg-slate-50 transition text-sm font-medium">
      <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
      Sign in with Google
    </button>
    <p id="auth-status" class="text-xs text-center mt-4 text-slate-500 min-h-[1rem]"></p>
  </div>

  <div id="app-container" class="hidden max-w-7xl mx-auto p-3 sm:p-4 md:p-6">
    <header class="flex flex-col sm:flex-row sm:items-center justify-between bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 gap-3 sm:gap-0">
      <div class="flex items-center gap-3">
        <img src="logo.png" alt="Logo" class="h-9 sm:h-10 w-auto shrink-0" />
        <div>
          <h1 class="text-lg sm:text-xl font-bold text-slate-900 leading-tight">DM Dental Clinic</h1>
          <p class="text-xs text-slate-500">Patients Log & Billing Directory</p>
        </div>
      </div>
      <div class="flex items-center justify-between sm:justify-end gap-3 w-full sm:w-auto pt-2 sm:pt-0 border-t sm:border-t-0 border-slate-100">
        <span id="user-display" class="text-xs text-slate-600 font-medium truncate max-w-[200px]"></span>
        <button onclick="handleLogout()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs px-3 py-2 rounded transition font-medium shrink-0">Logout</button>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="bg-white p-4 sm:p-5 rounded-xl shadow-sm border border-slate-200 h-fit">
        <h2 class="text-base sm:text-lg font-semibold text-slate-800 mb-4">+ Add Patient</h2>
        <form id="add-patient-form" onsubmit="handleAddPatient(event)" class="space-y-3">
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Surname *</label>
              <input type="text" id="p-surname" placeholder="e.g. Dela Cruz" required class="w-full p-2.5 text-sm border border-slate-300 rounded" />
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">First Name *</label>
              <input type="text" id="p-firstname" placeholder="e.g. Juan" required class="w-full p-2.5 text-sm border border-slate-300 rounded" />
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Middle Name / Initial</label>
              <input type="text" id="p-middlename" placeholder="e.g. Santos" class="w-full p-2.5 text-sm border border-slate-300 rounded" />
            </div>
          </div>
          
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Contact Number *</label>
              <input type="tel" id="p-contact" required class="w-full p-2.5 text-sm border border-slate-300 rounded" />
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Email (Optional)</label>
              <input type="email" id="p-email" placeholder="Optional" class="w-full p-2.5 text-sm border border-slate-300 rounded" />
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Procedure *</label>
              <input type="text" id="p-procedure" placeholder="e.g. Root Canal Therapy" required class="w-full p-2.5 text-sm border border-slate-300 rounded" />
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Procedure Date</label>
              <input type="date" id="p-date" class="w-full p-2.5 text-sm border border-slate-300 rounded bg-white" />
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Price (₱)</label>
              <input type="number" id="p-price" min="0" step="0.01" required class="w-full p-2.5 text-sm border border-slate-300 rounded" />
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Payment Type</label>
              <select id="p-paytype" onchange="toggleInitialPayment()" class="w-full p-2.5 text-sm border border-slate-300 rounded bg-white">
                <option value="Full payment">Full payment</option>
                <option value="Installment">Installment</option>
              </select>
            </div>
          </div>
          <div id="initial-pay-wrapper" class="hidden">
            <label class="block text-xs font-medium text-slate-600 mb-1">Initial Payment (₱)</label>
            <input type="number" id="p-initialpay" min="0" step="0.01" value="0" class="w-full p-2.5 text-sm border border-slate-300 rounded" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Mode of Payment</label>
            <select id="p-mode" class="w-full p-2.5 text-sm border border-slate-300 rounded bg-white">
              <option value="Cash">Cash</option>
              <option value="GCash">GCash</option>
              <option value="Bank Transfer">Bank Transfer</option>
              <option value="Credit Card">Credit Card</option>
            </select>
          </div>
          <button type="submit" class="w-full bg-slate-900 hover:bg-black text-white font-medium py-2.5 rounded text-sm transition mt-2">
            Save Patient Record
          </button>
        </form>
      </div>

      <div class="lg:col-span-2 space-y-3">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-2">
          <h2 class="text-base sm:text-lg font-semibold text-slate-800">Patient Files Directory (A-Z)</h2>
        </div>

        <div class="relative mb-3">
          <input type="text" id="patient-search" oninput="renderPatientFiles()" placeholder="🔍 Search patient by Surname, First Name, Contact, or Email..." class="w-full p-2.5 pl-3 text-sm border border-slate-300 rounded-xl shadow-sm focus:ring-2 focus:ring-slate-900 focus:outline-none bg-white" />
        </div>

        <div id="patient-files-container" class="space-y-3">
          <p class="text-slate-400 text-sm italic bg-white p-6 rounded-xl text-center border border-slate-200">Loading patient records...</p>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, 
      sendSignInLinkToEmail, isSignInWithEmailLink, signInWithEmailLink, 
      GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, push, onValue, update, off } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBMczsaJU-iJeczrU7XjbQa_XDL4EwJDQk",
      authDomain: "malinao-patient-logs.firebaseapp.com",
      databaseURL: "https://malinao-patient-logs-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "malinao-patient-logs",
      storageBucket: "malinao-patient-logs.firebasestorage.app",
      messagingSenderId: "865285500184",
      appId: "1:865285500184:web:2cccb04d615e91b7df026d",
      measurementId: "G-LCE1KEG853"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentAuthMode = 'login';
    let activePatientsRef = null;
    let cachedPatients = {};

    if (isSignInWithEmailLink(auth, window.location.href)) {
      let email = window.localStorage.getItem('emailForSignIn');
      if (!email) {
        email = window.prompt('Please provide your email for confirmation');
      }
      signInWithEmailLink(auth, email, window.location.href)
        .then(() => {
          window.localStorage.removeItem('emailForSignIn');
          alert('Successfully logged in via Email Link!');
        })
        .catch(err => alert(err.message));
    }

    onAuthStateChanged(auth, (user) => {
      const authContainer = document.getElementById('auth-container');
      const appContainer = document.getElementById('app-container');
      
      if (user) {
        authContainer.classList.add('hidden');
        appContainer.classList.remove('hidden');
        document.getElementById('user-display').innerText = user.email || 'Authenticated User';
        loadPatientFiles(user.uid);
      } else {
        if (activePatientsRef) {
          off(activePatientsRef);
          activePatientsRef = null;
        }
        authContainer.classList.remove('hidden');
        appContainer.classList.add('hidden');
      }
    });

    window.switchAuthTab = (mode) => {
      currentAuthMode = mode;
      const pwdWrapper = document.getElementById('password-wrapper');
      const submitBtn = document.getElementById('auth-submit-btn');

      document.getElementById('tab-login').className = "flex-1 py-2.5 font-medium transition " + (mode === 'login' ? "text-black border-b-2 border-black" : "text-slate-400 hover:text-slate-600");
      document.getElementById('tab-signup').className = "flex-1 py-2.5 font-medium transition " + (mode === 'signup' ? "text-black border-b-2 border-black" : "text-slate-400 hover:text-slate-600");
      document.getElementById('tab-link').className = "flex-1 py-2.5 font-medium transition " + (mode === 'link' ? "text-black border-b-2 border-black" : "text-slate-400 hover:text-slate-600");

      if (mode === 'link') {
        pwdWrapper.classList.add('hidden');
        submitBtn.innerText = 'Send Login Link';
      } else {
        pwdWrapper.classList.remove('hidden');
        submitBtn.innerText = mode === 'signup' ? 'Create Account' : 'Login';
      }
    };

    window.handleEmailAuth = async (e) => {
      e.preventDefault();
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      const statusEl = document.getElementById('auth-status');
      statusEl.innerText = '';

      try {
        if (currentAuthMode === 'login') {
          await signInWithEmailAndPassword(auth, email, password);
        } else if (currentAuthMode === 'signup') {
          await createUserWithEmailAndPassword(auth, email, password);
        } else if (currentAuthMode === 'link') {
          const actionCodeSettings = {
            url: window.location.href,
            handleCodeInApp: true,
          };
          await sendSignInLinkToEmail(auth, email, actionCodeSettings);
          window.localStorage.setItem('emailForSignIn', email);
          statusEl.innerText = 'Sign-in link sent! Please check your email inbox.';
        }
      } catch (error) {
        statusEl.innerText = error.message;
      }
    };

    window.handleGoogleSignIn = () => {
      const provider = new GoogleAuthProvider();
      signInWithPopup(auth, provider).catch(err => alert(err.message));
    };

    window.handleLogout = () => signOut(auth);

    window.toggleInitialPayment = () => {
      const payType = document.getElementById('p-paytype').value;
      const wrapper = document.getElementById('initial-pay-wrapper');
      if (payType === 'Installment') {
        wrapper.classList.remove('hidden');
      } else {
        wrapper.classList.add('hidden');
      }
    };

    function formatDateDisplay(isoStr) {
      if (!isoStr) return new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
      const [year, month, day] = isoStr.split('-');
      if (!year || !month || !day) return isoStr;
      const dateObj = new Date(year, month - 1, day);
      return dateObj.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
    }

    window.handleAddPatient = async (e) => {
      e.preventDefault();
      const currentUser = auth.currentUser;
      if (!currentUser) return;

      const surname = document.getElementById('p-surname').value.trim();
      const firstName = document.getElementById('p-firstname').value.trim();
      const middleName = document.getElementById('p-middlename').value.trim();
      const formattedFullName = `${surname}, ${firstName} ${middleName}`.trim();

      const price = parseFloat(document.getElementById('p-price').value) || 0;
      const payType = document.getElementById('p-paytype').value;
      const mode = document.getElementById('p-mode').value;
      const proc = document.getElementById('p-procedure').value;
      const email = document.getElementById('p-email').value.trim() || 'N/A';
      
      const customDateVal = document.getElementById('p-date').value;
      const isoDate = customDateVal ? customDateVal : new Date().toISOString().split('T')[0];
      const dateDisplay = formatDateDisplay(isoDate);

      let initialPay = (payType === 'Full payment') ? price : (parseFloat(document.getElementById('p-initialpay').value) || 0);

      const paymentHistory = [];
      if (initialPay > 0) {
        paymentHistory.push({
          isoDate: isoDate,
          date: dateDisplay,
          modeOfPayment: mode,
          paymentType: payType,
          procedure: proc,
          amountPaid: initialPay
        });
      }

      const patientData = {
        surname: surname,
        firstName: firstName,
        middleName: middleName,
        fullName: formattedFullName,
        email: email,
        contactNumber: document.getElementById('p-contact').value.trim(),
        procedures: [
          { name: proc, price: price, isoDate: isoDate, date: dateDisplay, paymentType: payType }
        ],
        totalPrice: price,
        totalPaid: initialPay,
        paymentHistory: paymentHistory,
        createdAt: new Date().toISOString()
      };

      await push(ref(db, `users/${currentUser.uid}/patients`), patientData);
      document.getElementById('add-patient-form').reset();
      toggleInitialPayment();
    };

    function loadPatientFiles(uid) {
      if (activePatientsRef) off(activePatientsRef);
      activePatientsRef = ref(db, `users/${uid}/patients`);

      onValue(activePatientsRef, (snapshot) => {
        cachedPatients = snapshot.val() || {};
        renderPatientFiles();
      });
    }

    function getCalculatedProcedures(patient) {
      let remainingPaid = patient.totalPaid || 0;
      const rawProcedures = patient.procedures || [];

      return rawProcedures.map((pr) => {
        const cost = parseFloat(pr.price) || 0;
        let statusStr = '';
        let statusClass = '';
        let unpaidBal = 0;

        if (remainingPaid >= cost) {
          remainingPaid -= cost;
          statusStr = 'Paid';
          statusClass = 'text-slate-900 font-semibold';
          unpaidBal = 0;
        } else if (remainingPaid > 0) {
          unpaidBal = cost - remainingPaid;
          remainingPaid = 0;
          statusStr = `Unpaid (Balance: ₱${unpaidBal.toLocaleString(undefined, { minimumFractionDigits: 2 })})`;
          statusClass = 'text-slate-600 font-semibold';
        } else {
          unpaidBal = cost;
          statusStr = `Unpaid (Balance: ₱${cost.toLocaleString(undefined, { minimumFractionDigits: 2 })})`;
          statusClass = 'text-slate-600 font-semibold';
        }

        return {
          date: pr.date || formatDateDisplay(pr.isoDate) || '-',
          isoDate: pr.isoDate || '',
          paymentType: pr.paymentType || '-',
          name: pr.name || '-',
          price: cost,
          status: statusStr,
          statusClass: statusClass,
          unpaidBal: unpaidBal
        };
      });
    }

    window.quickPayProcedure = (id, procName, balance) => {
      const amtInput = document.getElementById(`pay-amt-${id}`);
      const procInput = document.getElementById(`pay-proc-${id}`);
      
      if (amtInput && procInput) {
        procInput.value = procName;
        amtInput.value = balance.toFixed(2);
        
        amtInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
        amtInput.focus();
      }
    };

    window.renderPatientFiles = () => {
      const container = document.getElementById('patient-files-container');
      container.innerHTML = '';

      if (!cachedPatients || Object.keys(cachedPatients).length === 0) {
        container.innerHTML = `<p class="text-slate-400 text-sm bg-white p-6 rounded-xl border border-slate-200 text-center">No patient records found in your account.</p>`;
        return;
      }

      const searchQuery = (document.getElementById('patient-search')?.value || '').toLowerCase().trim();

      let patientList = Object.keys(cachedPatients).map(id => ({
        id: id,
        ...cachedPatients[id]
      }));

      patientList.sort((a, b) => {
        const nameA = (a.surname || a.fullName || '').toLowerCase();
        const nameB = (b.surname || b.fullName || '').toLowerCase();
        return nameA.localeCompare(nameB);
      });

      if (searchQuery) {
        patientList = patientList.filter(p => {
          const combinedStr = `${p.surname || ''} ${p.firstName || ''} ${p.middleName || ''} ${p.fullName || ''} ${p.contactNumber || ''} ${p.email || ''}`.toLowerCase();
          return combinedStr.includes(searchQuery);
        });
      }

      if (patientList.length === 0) {
        container.innerHTML = `<p class="text-slate-400 text-sm bg-white p-6 rounded-xl border border-slate-200 text-center">No matching patient records found.</p>`;
        return;
      }

      patientList.forEach((p) => {
        const id = p.id;
        const balance = p.totalPrice - p.totalPaid;
        const isPaid = balance <= 0;
        
        let historyList = [...(p.paymentHistory || [])];
        historyList.sort((a, b) => {
          const keyA = a.isoDate || a.date || '';
          const keyB = b.isoDate || b.date || '';
          return keyB.localeCompare(keyA);
        });

        const calculatedProcedures = getCalculatedProcedures(p);
        const displayName = p.fullName || `${p.surname || ''}, ${p.firstName || ''} ${p.middleName || ''}`.trim();

        const card = document.createElement('div');
        card.className = "bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden transition-all";
        card.innerHTML = `
          <div onclick="togglePatientFile('${id}')" class="p-3.5 sm:p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 cursor-pointer hover:bg-slate-50 transition select-none">
            <div class="min-w-0 flex-1">
              <h3 class="font-bold text-slate-800 text-base truncate">${displayName}</h3>
              <p class="text-xs text-slate-500 truncate">${p.contactNumber} • ${p.email}</p>
            </div>
            <div class="flex items-center justify-between w-full sm:w-auto gap-3 shrink-0 pt-2 sm:pt-0 border-t sm:border-t-0 border-slate-100">
              <span class="px-2.5 py-1 text-xs rounded-full font-semibold ${isPaid ? 'bg-slate-100 text-slate-900 border border-slate-300' : 'bg-slate-900 text-white'}">
                ${isPaid ? 'Paid' : 'Unpaid'}
              </span>
              <span class="text-xs font-semibold ${balance > 0 ? 'text-slate-900' : 'text-slate-600'}">
                ₱${(balance > 0 ? balance : 0).toLocaleString(undefined, { minimumFractionDigits: 2 })}
              </span>
              <svg id="chevron-${id}" class="w-5 h-5 text-slate-400 transition-transform duration-200 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
              </svg>
            </div>
          </div>

          <div id="expanded-box-${id}" class="hidden border-t border-slate-200 p-3.5 sm:p-5 bg-slate-50/60 space-y-4 sm:space-y-5">
            
            <div class="flex items-center justify-between border-b border-slate-200 pb-3">
              <span class="text-xs font-bold uppercase tracking-wider text-slate-900 bg-slate-200 px-2.5 py-1 rounded border border-slate-300">Patient Record Details</span>
            </div>

            <div class="bg-white p-3.5 sm:p-4 rounded-xl border border-slate-200 shadow-sm">
              <div class="flex justify-between items-center border-b border-slate-100 pb-2 mb-3">
                <h4 class="text-xs font-bold uppercase text-slate-500 tracking-wider">Patient Information</h4>
                <button id="edit-btn-${id}" onclick="toggleEditMode('${id}')" class="text-xs text-slate-900 font-semibold hover:underline">Edit</button>
              </div>

              <div id="info-view-${id}" class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 text-xs">
                <div><strong class="text-slate-500">FULL NAME:</strong> <span class="font-semibold text-slate-800 break-words">${displayName}</span></div>
                <div><strong class="text-slate-500">Contact Number:</strong> <span class="text-slate-700 break-words">${p.contactNumber}</span></div>

      e.preventDefault();
      const currentUser = auth.currentUser;
      if (!currentUser) return;

      const surname = document.getElementById(`edit-surname-${id}`).value.trim();
      const firstName = document.getElementById(`edit-firstname-${id}`).value.trim();
      const middleName = document.getElementById(`edit-middlename-${id}`).value.trim();
      const newContact = document.getElementById(`edit-contact-${id}`).value.trim();
      const newEmail = document.getElementById(`edit-email-${id}`).value.trim() || 'N/A';

      const formattedName = `${surname}, ${firstName} ${middleName}`.trim();

      await update(ref(db, `users/${currentUser.uid}/patients/${id}`), {

        firstName: firstName,
        middleName: middleName,
        fullName: formattedName,
        contactNumber: newContact,

    window.handleAddPayment = async (e, id) => {
      e.preventDefault();
      const currentUser = auth.currentUser;
      if (!currentUser || !cachedPatients[id]) return;

      const amt = parseFloat(document.getElementById(`pay-amt-${id}`).value) || 0;
      const mode = document.getElementById(`pay-mode-${id}`).value;
      const payType = document.getElementById(`pay-type-${id}`).value;
      const proc = document.getElementById(`pay-proc-${id}`).value.trim() || 'General Payment';
      const customDateVal = document.getElementById(`pay-date-${id}`).value;

      const isoDate = customDateVal ? customDateVal : new Date().toISOString().split('T')[0];
      const dateDisplay = formatDateDisplay(isoDate);

      if (amt <= 0) return;

      const p = cachedPatients[id];
      const newTotalPaid = (p.totalPaid || 0) + amt;
      const updatedHistory = [...(p.paymentHistory || []), {
        isoDate: isoDate,
        date: dateDisplay,
        modeOfPayment: mode,
        paymentType: payType,
        procedure: proc,
        amountPaid: amt
      }];

      await update(ref(db, `users/${currentUser.uid}/patients/${id}`), {
        totalPaid: newTotalPaid,
        paymentHistory: updatedHistory
      });
    };

      const procPrice = parseFloat(document.getElementById(`proc-price-${id}`).value) || 0;
      const procPayType = document.getElementById(`proc-paytype-${id}`).value;
      const customDateVal = document.getElementById(`proc-date-${id}`).value;

      const isoDate = customDateVal ? customDateVal : new Date().toISOString().split('T')[0];
      const dateDisplay = formatDateDisplay(isoDate);

      if (!procName || procPrice <= 0) return;

      const p = cachedPatients[id];
      const updatedProcedures = [...(p.procedures || []), { 
        name: procName, 
        price: procPrice, 
        paymentType: procPayType,
        isoDate: isoDate,
        date: dateDisplay
      }];
      const updatedTotal = (p.totalPrice || 0) + procPrice;

      await update(ref(db, `users/${currentUser.uid}/patients/${id}`), {
        procedures: updatedProcedures,
        totalPrice: updatedTotal
      });
    };
  </script>
</body>
</html>
