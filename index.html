<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Malinao Dental Clinic - Patient Logs</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800">

  <!-- AUTH SECTION -->
  <div id="auth-container" class="max-w-md mx-auto mt-12 p-6 bg-white rounded-xl shadow-md border border-slate-200">
    <h1 class="text-2xl font-bold text-teal-700 text-center mb-1">Malinao Dental Clinic</h1>
    <p class="text-sm text-slate-500 text-center mb-6">Patient Management System</p>

    <!-- Auth Tabs -->
    <div class="flex border-b border-slate-200 mb-4">
      <button id="tab-login" onclick="switchAuthTab('login')" class="flex-1 py-2 font-medium text-teal-600 border-b-2 border-teal-600">Login</button>
      <button id="tab-signup" onclick="switchAuthTab('signup')" class="flex-1 py-2 font-medium text-slate-400 hover:text-slate-600">Register</button>
      <button id="tab-link" onclick="switchAuthTab('link')" class="flex-1 py-2 font-medium text-slate-400 hover:text-slate-600">Passwordless</button>
    </div>

    <!-- Forms -->
    <form id="form-auth" onsubmit="handleEmailAuth(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Email</label>
        <input type="email" id="auth-email" required class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-teal-500 focus:outline-none" />
      </div>
      <div id="password-wrapper">
        <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Password</label>
        <input type="password" id="auth-password" class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-teal-500 focus:outline-none" />
      </div>
      <button type="submit" id="auth-submit-btn" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold py-2 rounded transition">
        Login
      </button>
    </form>

    <div class="relative my-6 text-center">
      <hr class="border-slate-200" />
      <span class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-white px-2 text-xs text-slate-400">OR</span>
    </div>

    <button onclick="handleGoogleSignIn()" class="w-full flex items-center justify-center gap-2 border border-slate-300 py-2 rounded hover:bg-slate-50 transition text-sm font-medium">
      <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
      Sign in with Google
    </button>
    <p id="auth-status" class="text-xs text-center mt-4 text-slate-500"></p>
  </div>

  <!-- MAIN APP DASHBOARD -->
  <div id="app-container" class="hidden max-w-7xl mx-auto p-4 md:p-6">
    <header class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6">
      <div>
        <h1 class="text-xl font-bold text-teal-800">Malinao Dental Clinic</h1>
        <p class="text-xs text-slate-500">Patients Log & Billing</p>
      </div>
      <div class="flex items-center gap-4">
        <span id="user-display" class="text-xs text-slate-600 font-medium hidden md:inline"></span>
        <button onclick="handleLogout()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs px-3 py-2 rounded transition font-medium">Logout</button>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- ADD PATIENT FORM -->
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 h-fit">
        <h2 class="text-lg font-semibold text-slate-800 mb-4">+ Add Patient</h2>
        <form id="add-patient-form" onsubmit="handleAddPatient(event)" class="space-y-3">
          <div>
            <label class="block text-xs font-medium text-slate-600">Full Name</label>
            <input type="text" id="p-name" required class="w-full p-2 text-sm border border-slate-300 rounded" />
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-medium text-slate-600">Email</label>
              <input type="email" id="p-email" required class="w-full p-2 text-sm border border-slate-300 rounded" />
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-600">Contact Number</label>
              <input type="tel" id="p-contact" required class="w-full p-2 text-sm border border-slate-300 rounded" />
            </div>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600">Procedure</label>
            <input type="text" id="p-procedure" placeholder="e.g. Tooth Extraction" required class="w-full p-2 text-sm border border-slate-300 rounded" />
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-medium text-slate-600">Price (₱)</label>
              <input type="number" id="p-price" min="0" step="0.01" required class="w-full p-2 text-sm border border-slate-300 rounded" />
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-600">Payment Type</label>
              <select id="p-paytype" onchange="toggleInitialPayment()" class="w-full p-2 text-sm border border-slate-300 rounded">
                <option value="Full payment">Full payment</option>
                <option value="Installment">Installment</option>
              </select>
            </div>
          </div>
          <div id="initial-pay-wrapper" class="hidden">
            <label class="block text-xs font-medium text-slate-600">Initial Payment (₱)</label>
            <input type="number" id="p-initialpay" min="0" step="0.01" value="0" class="w-full p-2 text-sm border border-slate-300 rounded" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600">Mode of Payment</label>
            <select id="p-mode" class="w-full p-2 text-sm border border-slate-300 rounded">
              <option value="Cash">Cash</option>
              <option value="GCash">GCash</option>
              <option value="Bank Transfer">Bank Transfer</option>
              <option value="Credit Card">Credit Card</option>
            </select>
          </div>
          <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-medium py-2 rounded text-sm transition">
            Save Patient Record
          </button>
        </form>
      </div>

      <!-- PATIENT LIST TABLE -->
      <div class="lg:col-span-2 bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-semibold text-slate-800 mb-4">Patient Log Directory</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="bg-slate-50 text-slate-600 text-xs uppercase border-b border-slate-200">
              <tr>
                <th class="p-3">Patient</th>
                <th class="p-3">Contact</th>
                <th class="p-3">Status</th>
                <th class="p-3">Balance</th>
                <th class="p-3 text-right">Action</th>
              </tr>
            </thead>
            <tbody id="patient-list-body" class="divide-y divide-slate-100">
              <tr><td colspan="5" class="p-4 text-center text-slate-400">Loading patient records...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- EDIT / VIEW MODAL -->
  <div id="patient-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-lg rounded-xl shadow-lg border border-slate-200 p-6 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-start border-b pb-3 border-slate-200">
        <div>
          <h3 id="m-name" class="text-lg font-bold text-slate-800"></h3>
          <p id="m-contact" class="text-xs text-slate-500"></p>
        </div>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
      </div>

      <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 grid grid-cols-3 text-center text-xs">
        <div>
          <span class="block text-slate-400 uppercase">Total Bill</span>
          <span id="m-total" class="font-semibold text-slate-700 text-sm"></span>
        </div>
        <div>
          <span class="block text-slate-400 uppercase">Paid</span>
          <span id="m-paid" class="font-semibold text-teal-600 text-sm"></span>
        </div>
        <div>
          <span class="block text-slate-400 uppercase">Balance</span>
          <span id="m-balance" class="font-semibold text-rose-600 text-sm"></span>
        </div>
      </div>

      <div>
        <h4 class="text-xs font-bold uppercase text-slate-500 mb-2">Procedures Log</h4>
        <ul id="m-procedures-list" class="text-xs space-y-1 bg-slate-50 p-2 rounded border border-slate-200"></ul>
      </div>

      <div class="border-t pt-3 border-slate-200 space-y-3">
        <!-- Mark as Paid -->
        <button id="m-btn-mark-paid" onclick="handleMarkAsPaid()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold py-2 rounded transition">
          Mark as Fully Paid
        </button>

        <!-- Additional Payment Form -->
        <form onsubmit="handleAddPayment(event)" class="flex gap-2">
          <input type="number" id="m-add-payment" placeholder="Add payment (₱)" min="0" step="0.01" required class="flex-1 p-2 text-xs border rounded" />
          <button type="submit" class="bg-teal-600 hover:bg-teal-700 text-white text-xs px-3 rounded font-medium">Add Payment</button>
        </form>

        <!-- Add Procedure Form -->
        <form onsubmit="handleAddProcedure(event)" class="space-y-2 pt-2 border-t border-slate-100">
          <p class="text-xs font-bold uppercase text-slate-500">Add Procedure</p>
          <div class="flex gap-2">
            <input type="text" id="m-add-proc-name" placeholder="Procedure name" required class="flex-1 p-2 text-xs border rounded" />
            <input type="number" id="m-add-proc-price" placeholder="Price (₱)" min="0" step="0.01" required class="w-24 p-2 text-xs border rounded" />
          </div>
          <button type="submit" class="w-full bg-slate-800 hover:bg-slate-900 text-white text-xs py-2 rounded font-medium">
            Add Procedure & Price
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- FIREBASE MODULE LOGIC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, 
      sendSignInLinkToEmail, isSignInWithEmailLink, signInWithEmailLink, 
      GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, push, onValue, update, off } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBMczsaJU-iJeczrU7XjbQa_XDL4EwJDQk",
      authDomain: "malinao-patient-logs.firebaseapp.com",
      databaseURL: "https://malinao-patient-logs-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "malinao-patient-logs",
      storageBucket: "malinao-patient-logs.firebasestorage.app",
      messagingSenderId: "865285500184",
      appId: "1:865285500184:web:2cccb04d615e91b7df026d",
      measurementId: "G-LCE1KEG853"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentMode = 'login';
    let currentPatientId = null;
    let currentPatientData = null;
    let activePatientsRef = null;

    // Check for passwordless email sign-in link
    if (isSignInWithEmailLink(auth, window.location.href)) {
      let email = window.localStorage.getItem('emailForSignIn');
      if (!email) {
        email = window.prompt('Please provide your email for confirmation');
      }
      signInWithEmailLink(auth, email, window.location.href)
        .then(() => {
          window.localStorage.removeItem('emailForSignIn');
          alert('Successfully logged in via Email Link!');
        })
        .catch(err => alert(err.message));
    }

    // Auth State Changed
    onAuthStateChanged(auth, (user) => {
      const authContainer = document.getElementById('auth-container');
      const appContainer = document.getElementById('app-container');
      
      if (user) {
        authContainer.classList.add('hidden');
        appContainer.classList.remove('hidden');
        document.getElementById('user-display').innerText = user.email || 'Authenticated User';
        loadPatients(user.uid);
      } else {
        if (activePatientsRef) {
          off(activePatientsRef);
          activePatientsRef = null;
        }
        authContainer.classList.remove('hidden');
        appContainer.classList.add('hidden');
      }
    });

    // Handle Tab Switch
    window.switchAuthTab = (mode) => {
      currentMode = mode;
      const pwdWrapper = document.getElementById('password-wrapper');
      const submitBtn = document.getElementById('auth-submit-btn');

      document.getElementById('tab-login').className = "flex-1 py-2 font-medium " + (mode === 'login' ? "text-teal-600 border-b-2 border-teal-600" : "text-slate-400 hover:text-slate-600");
      document.getElementById('tab-signup').className = "flex-1 py-2 font-medium " + (mode === 'signup' ? "text-teal-600 border-b-2 border-teal-600" : "text-slate-400 hover:text-slate-600");
      document.getElementById('tab-link').className = "flex-1 py-2 font-medium " + (mode === 'link' ? "text-teal-600 border-b-2 border-teal-600" : "text-slate-400 hover:text-slate-600");

      if (mode === 'link') {
        pwdWrapper.classList.add('hidden');
        submitBtn.innerText = 'Send Login Link';
      } else {
        pwdWrapper.classList.remove('hidden');
        submitBtn.innerText = mode === 'signup' ? 'Create Account' : 'Login';
      }
    };

    // Auth Handlers
    window.handleEmailAuth = async (e) => {
      e.preventDefault();
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      const statusEl = document.getElementById('auth-status');
      statusEl.innerText = '';

      try {
        if (currentMode === 'login') {
          await signInWithEmailAndPassword(auth, email, password);
        } else if (currentMode === 'signup') {
          await createUserWithEmailAndPassword(auth, email, password);
        } else if (currentMode === 'link') {
          const actionCodeSettings = {
            url: window.location.href,
            handleCodeInApp: true,
          };
          await sendSignInLinkToEmail(auth, email, actionCodeSettings);
          window.localStorage.setItem('emailForSignIn', email);
          statusEl.innerText = 'Sign-in link sent! Please check your email inbox.';
        }
      } catch (error) {
        statusEl.innerText = error.message;
      }
    };

    window.handleGoogleSignIn = () => {
      const provider = new GoogleAuthProvider();
      signInWithPopup(auth, provider).catch(err => alert(err.message));
    };

    window.handleLogout = () => signOut(auth);

    // Toggle Payment Input
    window.toggleInitialPayment = () => {
      const payType = document.getElementById('p-paytype').value;
      const wrapper = document.getElementById('initial-pay-wrapper');
      if (payType === 'Installment') {
        wrapper.classList.remove('hidden');
      } else {
        wrapper.classList.add('hidden');
      }
    };

    // Account-Scoped Patient CRUD Operations
    window.handleAddPatient = async (e) => {
      e.preventDefault();
      const currentUser = auth.currentUser;
      if (!currentUser) return;

      const price = parseFloat(document.getElementById('p-price').value) || 0;
      const payType = document.getElementById('p-paytype').value;
      let initialPay = (payType === 'Full payment') ? price : (parseFloat(document.getElementById('p-initialpay').value) || 0);

      const patientData = {
        fullName: document.getElementById('p-name').value,
        email: document.getElementById('p-email').value,
        contactNumber: document.getElementById('p-contact').value,
        procedures: [
          { name: document.getElementById('p-procedure').value, price: price }
        ],
        totalPrice: price,
        totalPaid: initialPay,
        paymentType: payType,
        modeOfPayment: document.getElementById('p-mode').value,
        createdAt: new Date().toISOString()
      };

      // Saves specifically under users/{UID}/patients
      await push(ref(db, `users/${currentUser.uid}/patients`), patientData);
      document.getElementById('add-patient-form').reset();
      toggleInitialPayment();
    };

    function loadPatients(uid) {
      if (activePatientsRef) {
        off(activePatientsRef);
      }
      // Reads specifically from users/{UID}/patients
      activePatientsRef = ref(db, `users/${uid}/patients`);

      onValue(activePatientsRef, (snapshot) => {
        const tbody = document.getElementById('patient-list-body');
        tbody.innerHTML = '';
        const data = snapshot.val();

        if (!data) {
          tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-400">No patient records found for this account.</td></tr>`;
          return;
        }

        Object.keys(data).forEach((id) => {
          const p = data[id];
          const balance = p.totalPrice - p.totalPaid;
          const isPaid = balance <= 0;

          const tr = document.createElement('tr');
          tr.className = "hover:bg-slate-50 transition border-b border-slate-100";
          tr.innerHTML = `
            <td class="p-3 font-medium text-slate-800">${p.fullName}</td>
            <td class="p-3 text-slate-500 text-xs">${p.contactNumber}</td>
            <td class="p-3">
              <span class="px-2 py-0.5 text-xs rounded-full font-semibold ${isPaid ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">
                ${isPaid ? 'Paid' : 'Unpaid'}
              </span>
            </td>
            <td class="p-3 text-xs font-semibold ${balance > 0 ? 'text-rose-600' : 'text-emerald-600'}">
              ₱${balance.toLocaleString(undefined, { minimumFractionDigits: 2 })}
            </td>
            <td class="p-3 text-right">
              <button onclick="openModal('${id}', '${encodeURIComponent(JSON.stringify(p))}')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1 rounded text-xs font-medium">
                View / Edit
              </button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      });
    }

    // Modal Helpers
    window.openModal = (id, encodedData) => {
      currentPatientId = id;
      currentPatientData = JSON.parse(decodeURIComponent(encodedData));
      
      const balance = currentPatientData.totalPrice - currentPatientData.totalPaid;

      document.getElementById('m-name').innerText = currentPatientData.fullName;
      document.getElementById('m-contact').innerText = `${currentPatientData.email} | ${currentPatientData.contactNumber}`;
      document.getElementById('m-total').innerText = `₱${currentPatientData.totalPrice.toLocaleString()}`;
      document.getElementById('m-paid').innerText = `₱${currentPatientData.totalPaid.toLocaleString()}`;
      document.getElementById('m-balance').innerText = `₱${(balance > 0 ? balance : 0).toLocaleString()}`;

      const procList = document.getElementById('m-procedures-list');
      procList.innerHTML = '';
      (currentPatientData.procedures || []).forEach(proc => {
        const li = document.createElement('li');
        li.className = "flex justify-between py-1 border-b border-slate-100 last:border-0";
        li.innerHTML = `<span>${proc.name}</span><span class="font-medium">₱${proc.price.toLocaleString()}</span>`;
        procList.appendChild(li);
      });

      const btnMarkPaid = document.getElementById('m-btn-mark-paid');
      if (balance <= 0) {
        btnMarkPaid.classList.add('hidden');
      } else {
        btnMarkPaid.classList.remove('hidden');
      }

      document.getElementById('patient-modal').classList.remove('hidden');
    };

    window.closeModal = () => {
      document.getElementById('patient-modal').classList.add('hidden');
      currentPatientId = null;
      currentPatientData = null;
    };

    window.handleMarkAsPaid = async () => {
      const currentUser = auth.currentUser;
      if (!currentPatientId || !currentPatientData || !currentUser) return;
      await update(ref(db, `users/${currentUser.uid}/patients/${currentPatientId}`), {
        totalPaid: currentPatientData.totalPrice
      });
      closeModal();
    };

    window.handleAddPayment = async (e) => {
      e.preventDefault();
      const currentUser = auth.currentUser;
      const amount = parseFloat(document.getElementById('m-add-payment').value) || 0;
      if (amount <= 0 || !currentPatientId || !currentUser) return;

      const newTotalPaid = (currentPatientData.totalPaid || 0) + amount;
      await update(ref(db, `users/${currentUser.uid}/patients/${currentPatientId}`), {
        totalPaid: newTotalPaid
      });
      closeModal();
    };

    window.handleAddProcedure = async (e) => {
      e.preventDefault();
      const currentUser = auth.currentUser;
      const procName = document.getElementById('m-add-proc-name').value;
      const procPrice = parseFloat(document.getElementById('m-add-proc-price').value) || 0;
      
      if (!procName || procPrice <= 0 || !currentPatientId || !currentUser) return;

      const updatedProcedures = [...(currentPatientData.procedures || []), { name: procName, price: procPrice }];
      const updatedTotal = (currentPatientData.totalPrice || 0) + procPrice;

      await update(ref(db, `users/${currentUser.uid}/patients/${currentPatientId}`), {
        procedures: updatedProcedures,
        totalPrice: updatedTotal
      });
      closeModal();
    };
  </script>
</body>
</html>
